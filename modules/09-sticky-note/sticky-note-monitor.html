            <!-- Sticky Note Wall Display Area (Teacher) -->
            <div id="sticky-note-wall"
                class="hidden bg-gradient-to-br from-slate-50 to-slate-100 rounded-2xl border border-slate-200 h-[calc(100vh-180px)] overflow-hidden relative">
                <!-- Toolbar -->
                <div
                    class="absolute top-0 left-0 right-0 bg-white/90 backdrop-blur-sm border-b border-slate-200 p-3 flex items-center gap-4 z-[2000]">
                    <!-- Scale Controls -->
                    <div class="flex items-center gap-2 border-r border-slate-300 pr-4">
                        <span class="text-sm font-medium text-slate-600">縮放：</span>
                        <button id="sticky-zoom-out"
                            class="w-8 h-8 rounded bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-700"
                            title="縮小">
                            <i class="fas fa-minus text-xs"></i>
                        </button>
                        <span id="sticky-zoom-level"
                            class="text-sm font-bold text-slate-700 w-12 text-center">100%</span>
                        <button id="sticky-zoom-in"
                            class="w-8 h-8 rounded bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-700"
                            title="放大">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                        <button id="sticky-zoom-reset"
                            class="px-3 h-8 rounded bg-slate-200 hover:bg-slate-300 text-xs font-medium text-slate-700"
                            title="重置">
                            重置
                        </button>
                    </div>

                    <!-- Mode Toggle -->
                    <div class="flex items-center gap-2 border-r border-slate-300 pr-4">
                        <span class="text-sm font-medium text-slate-600">模式：</span>
                        <button id="mouse-mode"
                            class="w-8 h-8 rounded bg-blue-500 text-white flex items-center justify-center"
                            title="滑鼠模式">
                            <i class="fas fa-mouse-pointer text-xs"></i>
                        </button>
                        <button id="draw-mode"
                            class="w-8 h-8 rounded bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-700"
                            title="繪圖模式">
                            <i class="fas fa-pencil-alt text-xs"></i>
                        </button>
                    </div>

                    <!-- Drawing Tools -->
                    <div class="flex items-center gap-2 opacity-50" id="drawing-tools">
                        <span class="text-sm font-medium text-slate-600">畫筆：</span>
                        <button id="pen-tool"
                            class="w-8 h-8 rounded bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-700"
                            title="畫筆">
                            <i class="fas fa-pen text-xs"></i>
                        </button>
                        <button id="eraser-tool"
                            class="w-8 h-8 rounded bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-700"
                            title="橡皮擦">
                            <i class="fas fa-eraser text-xs"></i>
                        </button>

                        <!-- Color Picker -->
                        <div class="flex gap-1">
                            <button class="pen-color w-6 h-6 rounded border-2 border-slate-400"
                                style="background: #000000" data-color="#000000" title="黑色"></button>
                            <button class="pen-color w-6 h-6 rounded border border-slate-300"
                                style="background: #ef4444" data-color="#ef4444" title="紅色"></button>
                            <button class="pen-color w-6 h-6 rounded border border-slate-300"
                                style="background: #3b82f6" data-color="#3b82f6" title="藍色"></button>
                            <button class="pen-color w-6 h-6 rounded border border-slate-300"
                                style="background: #10b981" data-color="#10b981" title="綠色"></button>
                            <button class="pen-color w-6 h-6 rounded border border-slate-300"
                                style="background: #f59e0b" data-color="#f59e0b" title="橙色"></button>
                        </div>

                        <!-- Line Width -->
                        <select id="pen-width" class="h-8 px-2 rounded border border-slate-300 text-xs">
                            <option value="2">細</option>
                            <option value="4" selected>中</option>
                            <option value="8">粗</option>
                        </select>

                        <button id="clear-canvas"
                            class="px-3 h-8 rounded bg-red-100 hover:bg-red-200 text-red-700 text-xs font-medium"
                            title="清除畫記">
                            清除畫記
                        </button>
                    </div>
                </div>

                <!-- Content Area -->
                <div id="sticky-wall-scroll" class="absolute top-16 left-0 right-0 bottom-0 overflow-hidden">
                    <!-- Drawing Canvas Layer (Top) -->
                    <canvas id="sticky-drawing-canvas" class="absolute top-0 left-0 pointer-events-none w-full h-full"
                        style="z-index: 1000;"></canvas>

                    <!-- Sticky Notes Container (Bottom) -->
                    <div id="sticky-notes-container" class="absolute top-0 left-0 w-full h-full" style="z-index: 1;">
                        <div class="text-center py-10 text-slate-400 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"
                            id="sticky-note-placeholder">
                            <i class="fas fa-note-sticky text-4xl mb-4"></i>
                            <p class="text-lg font-medium">等待學生送出便利貼...</p>
                        </div>
                    </div>
                </div>
            </div>
