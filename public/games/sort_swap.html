<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排序遊戲：排排站換位置</title>
    <style>
:root {
    --ink: #3a2e5c;
    --paper: rgba(255, 255, 255, 0.85);
    --cat: #ff9f43;
    --dog: #4dabf7;
    --pink: #ff8fb1;
    --mint: #2ec4a6;
    --grape: #9775fa;
    --coral: #ff6b6b;
    --font-plain: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    --font-zhuyin: 'ㄅ注音芫荽 Regular', 'BpmfIansui', 'Iansui', var(--font-plain);
    --font: var(--font-zhuyin);
}
:root.plain { --font: var(--font-plain); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(160deg, #ffe3ee, #e3ecff 50%, #d9f8ea) fixed;
    overflow-x: hidden;
}
body::before, body::after {
    content: "";
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    filter: blur(40px);
    opacity: .6;
    animation: drift 14s ease-in-out infinite alternate;
}
body::before { width: 42vmax; height: 42vmax; left: -12vmax; top: -10vmax; background: #ffd6a5; }
body::after { width: 38vmax; height: 38vmax; right: -10vmax; bottom: -12vmax; background: #a5d8ff; animation-delay: -7s; }
@keyframes drift { to { transform: translate(4vmax, 3vmax) scale(1.12); } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.topbar, .hud { width: min(900px, calc(100vw - 24px)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0 8px; }
.logo { margin: 0; font-size: clamp(20px, 4.2vw, 30px); font-weight: 900; letter-spacing: .06em; }
.logo span { display: inline-block; animation: wiggle 2.4s ease-in-out infinite; }
.logo span:last-child { animation-delay: -1.2s; }

.switch {
    display: inline-flex; align-items: center; gap: 8px;
    font: inherit; font-weight: 800; color: var(--ink);
    background: var(--paper); border: 0; border-radius: 999px;
    padding: 6px 14px 6px 8px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(58, 46, 92, .15);
    transition: transform .1s, box-shadow .1s;
}
.switch:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(58, 46, 92, .15); }
.switch .track { width: 44px; height: 26px; border-radius: 999px; background: #c9c3dc; position: relative; transition: background .25s; }
.switch .thumb {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .25);
    transition: transform .25s cubic-bezier(.3, 1.6, .5, 1);
}
.switch[aria-checked="true"] .track { background: var(--mint); }
.switch[aria-checked="true"] .thumb { transform: translateX(18px); }

.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
.player {
    display: flex; align-items: center; gap: 8px;
    background: var(--paper); border-radius: 999px; padding: 6px 14px;
    box-shadow: 0 4px 0 rgba(58, 46, 92, .12); backdrop-filter: blur(6px);
    min-height: 46px;
}
.player.dog { flex-direction: row-reverse; }
.avatar { font-size: 28px; line-height: 1; }
.bar { flex: 1; height: 22px; border-radius: 999px; background: rgba(58, 46, 92, .12); position: relative; overflow: hidden; }
.fill { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; border-radius: inherit; transition: width .4s ease, background .3s; }
.player.dog .fill { left: auto; right: 0; }
.player.cat .fill { background: linear-gradient(90deg, #ffc078, var(--cat)); }
.player.dog .fill { background: linear-gradient(270deg, #74c0fc, var(--dog)); }
.player .fill.low { background: linear-gradient(90deg, #ff8787, var(--coral)); }
.player.boss .fill { background: linear-gradient(90deg, #b197fc, #7048e8); }
.hp { font-weight: 900; min-width: 2.4em; text-align: center; }
.vs { font-weight: 900; font-size: 20px; color: var(--pink); }
.info { font-size: 13px; font-weight: 800; white-space: nowrap; }

.stage {
    position: relative;
    width: min(900px, calc(100vw - 24px), max(320px, calc((100dvh - var(--chrome, 210px)) * var(--ratio, 1.3846))));
    aspect-ratio: var(--ratio, 1.3846);
    border-radius: 28px; overflow: hidden;
    border: 4px solid #fff;
    box-shadow: 0 10px 0 rgba(58, 46, 92, .14), 0 22px 40px rgba(58, 46, 92, .18);
    background: #bfe6ff; touch-action: manipulation;
}
canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.hint {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    max-width: calc(100% - 20px);
    background: rgba(255, 255, 255, .92); padding: 6px 16px; border-radius: 999px;
    font-weight: 800; font-size: clamp(13px, 2.2vw, 18px); text-align: center;
    pointer-events: none; box-shadow: 0 3px 0 rgba(58, 46, 92, .12);
}
.hint:empty { display: none; }

footer { padding: 12px 0 14px; font-size: 14px; font-weight: 700; }
footer a { color: var(--grape); }

.overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 12px; background: rgba(58, 46, 92, .35); backdrop-filter: blur(6px);
}
.overlay.show { display: flex; }
#question-layer.overlay { z-index: 1500; }
#choice { z-index: 1600; }
#generator-screen { z-index: 2000; }
#game-over { z-index: 1800; }
.card {
    width: min(900px, 100%); max-height: calc(100dvh - 24px); overflow: auto;
    background: #fff; border-radius: 28px; padding: clamp(14px, 3vw, 26px);
    box-shadow: 0 10px 0 rgba(58, 46, 92, .18), 0 24px 50px rgba(58, 46, 92, .3);
    animation: pop .3s cubic-bezier(.3, 1.6, .5, 1);
}

#question-text {
    margin: 0 0 14px; padding: 12px 16px; border-radius: 18px;
    background: linear-gradient(135deg, #f3ecff, #e6f4ff);
    font-size: clamp(18px, 3.4vw, 28px); font-weight: 900; line-height: 1.7; text-align: center;
}
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side { border-radius: 20px; padding: 10px; transition: opacity .2s; }
.side.cat { background: rgba(255, 159, 67, .14); }
.side.dog { background: rgba(77, 171, 247, .14); }
.side.locked { opacity: .45; pointer-events: none; }
.side h3 { margin: 0 0 8px; text-align: center; font-size: clamp(15px, 2.4vw, 19px); }
.options { display: flex; flex-direction: column; gap: 10px; }
.options.blurred .opt { filter: blur(7px); }
.opt {
    --c: var(--coral);
    font: inherit; font-size: clamp(15px, 2.4vw, 21px); font-weight: 800; line-height: 1.5;
    color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    min-height: clamp(46px, 8vw, 62px); padding: 6px 10px;
    border: 0; border-radius: 16px; background: var(--c);
    box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 68%, #000);
    cursor: pointer; transition: transform .1s, box-shadow .1s, filter .2s;
}
.opt:hover { filter: brightness(1.08); }
.opt:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 68%, #000); }
.opt.c1 { --c: var(--mint); }
.opt.c2 { --c: var(--dog); }
.opt.c3 { --c: var(--grape); }
.opt.wrong { text-decoration: line-through; opacity: .4; pointer-events: none; animation: shake .3s; }
.opt.right { --c: #2f9e44; outline: 4px solid #fff; pointer-events: none; }
.opt.right::after { content: " ✓"; }

/* 下方嵌入式題目（快節奏玩法） */
.dock { width: min(900px, calc(100vw - 24px)); margin-top: 14px; padding: 12px; max-height: none; overflow: visible; animation: none; border-radius: 24px; }
.dock .hint { position: static; transform: none; max-width: none; margin: 0 0 8px; box-shadow: none; background: #fff6d9; border-radius: 14px; font-size: clamp(13px, 2vw, 16px); }
.dock.idle .options { opacity: .45; pointer-events: none; }
.dock #question-text { font-size: clamp(16px, 2.6vw, 22px); padding: 8px 12px; margin-bottom: 8px; }
.dock .side { padding: 8px; }
.dock .side h3 { margin-bottom: 6px; font-size: 15px; }
.dock .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dock .opt { min-height: 44px; font-size: clamp(14px, 2vw, 18px); box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 68%, #000); }

.btn {
    font: inherit; font-weight: 800; font-size: clamp(15px, 2.4vw, 18px); color: #fff;
    border: 0; border-radius: 16px; padding: 10px 20px; background: var(--mint);
    box-shadow: 0 5px 0 rgba(0, 0, 0, .18); cursor: pointer;
    transition: transform .1s, box-shadow .1s, filter .2s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .18); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.grape { background: var(--grape); }
.btn.sky { background: var(--dog); }
.btn.pink { background: var(--pink); }
.btn.orange { background: var(--cat); }
.btn[hidden] { display: none; }

#game-over .card, #choice .card { width: min(440px, 100%); text-align: center; }
#winner-text, #choice-title { margin: 0 0 14px; font-weight: 900; }
#winner-text { font-size: clamp(34px, 9vw, 56px); color: var(--coral); }
#choice-title { font-size: clamp(20px, 4vw, 26px); }
#choice .actions { flex-direction: column; }

.cards { flex: 1; display: flex; gap: 6px; min-height: 30px; align-items: center; }
.player.dog .cards { flex-direction: row-reverse; }
.card-btn {
    font: inherit; font-weight: 800; font-size: 13px; color: var(--ink);
    background: #fff; border: 2px solid #e3dcf5; border-radius: 12px; padding: 3px 8px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(58, 46, 92, .15); animation: pop .3s;
}
.card-btn:active { transform: translateY(2px); box-shadow: none; }
.cards .empty { font-size: 12px; opacity: .55; font-weight: 700; }

#generator-screen .card { text-align: center; }
#generator-screen h1 { margin: 0 0 14px; font-size: clamp(20px, 4vw, 28px); }
#generator-input {
    width: 100%; height: 110px; margin-bottom: 14px; padding: 12px;
    font: inherit; font-size: 16px; color: var(--ink);
    border: 3px solid #e3dcf5; border-radius: 16px; resize: vertical;
}
#generator-input:focus { outline: none; border-color: var(--grape); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 14px; }
.table-wrap { max-height: 38dvh; overflow: auto; border-radius: 14px; border: 2px solid #eee8fa; }
#output-table { width: 100%; border-collapse: collapse; font-size: 14px; }
#output-table th { position: sticky; top: 0; background: #efe9ff; }
#output-table th, #output-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee8fa; }

#secret-trigger { position: fixed; bottom: 0; left: 0; width: 50px; height: 50px; z-index: 9999; }

@media (max-width: 640px) {
    .hud { grid-template-columns: 1fr 1fr; }
    .vs { display: none; }
    .sides { gap: 8px; }
    .dock .sides { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* 鍵盤提示 */
.opt[data-key]::before {
    content: attr(data-key);
    display: inline-block; min-width: 1.6em; margin-right: .5em; padding: 0 .35em;
    border-radius: 8px; background: rgba(255, 255, 255, .3); font-size: .75em;
}

/* 大屏版面 */
body.big .topbar, body.big .hud, body.big .dock { width: min(1400px, calc(100vw - 32px)); }
body.big .stage { width: min(1400px, calc(100vw - 32px), max(600px, calc((100dvh - var(--chrome)) * var(--ratio)))); }
body.big .logo { font-size: clamp(22px, 2.6vw, 40px); }
body.big .player { min-height: clamp(46px, 4.6vw, 70px); padding: 6px clamp(14px, 1.6vw, 26px); }
body.big .avatar { font-size: clamp(28px, 3vw, 46px); }
body.big .bar { height: clamp(22px, 2.4vw, 36px); }
body.big .hp { font-size: clamp(16px, 1.8vw, 28px); }
body.big .vs { font-size: clamp(20px, 2.4vw, 36px); }
body.big #question-text { font-size: clamp(20px, 2.8vw, 46px); padding: clamp(8px, 1vw, 16px); }
body.big .opt { font-size: clamp(18px, 2.1vw, 34px); min-height: clamp(48px, 5vw, 84px); }
body.big .dock .side h3 { font-size: clamp(16px, 1.8vw, 28px); }
body.big .dock .hint { font-size: clamp(14px, 1.6vw, 24px); }

/* 紅藍隊配色 */
.theme-rb .side.cat { background: rgba(255, 107, 107, .14); }
.theme-rb .side.dog { background: rgba(77, 171, 247, .14); }
.theme-rb .player.cat .fill { background: linear-gradient(90deg, #ffa8a8, #ff6b6b); }
.theme-rb .player.dog .fill { background: linear-gradient(270deg, #74c0fc, #4dabf7); }
.theme-rb .player.dog { flex-direction: row-reverse; }

/* 單人練習版面 */
body.solo .topbar, body.solo .hud, body.solo .dock { width: min(1100px, calc(100vw - 32px)); }
body.solo .stage { width: min(1100px, calc(100vw - 32px), max(520px, calc((100dvh - var(--chrome)) * var(--ratio)))); }
body.solo .hud { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; }
body.solo .dock { margin: 0 0 12px; padding: 10px 14px; }
body.solo #question-text { margin: 0; }
.solo-chip {
    display: flex; align-items: center; gap: 8px; padding: 6px 18px; border-radius: 999px;
    background: var(--paper); box-shadow: 0 4px 0 rgba(58, 46, 92, .12); backdrop-filter: blur(6px);
    font-weight: 900; font-size: clamp(16px, 1.8vw, 26px);
}
.solo-chip b { min-width: 2em; text-align: center; color: var(--grape); }
#final-stats { margin: 0 0 14px; font-weight: 800; font-size: clamp(15px, 2vw, 20px); line-height: 1.7; }

/* 單人練習：觸控操作 */
body.solo canvas { touch-action: none; }
#touch-ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
body.touch-off #touch-ui { display: none; }
.joy {
    position: absolute; left: 14px; bottom: 14px; width: 132px; height: 132px; border-radius: 50%;
    background: rgba(255, 255, 255, .32); border: 3px solid rgba(255, 255, 255, .85);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .28); pointer-events: auto; touch-action: none; user-select: none;
}
.joy .a { position: absolute; font-style: normal; font-size: 15px; color: rgba(58, 46, 92, .7); }
.joy .up { top: 6px; left: 50%; transform: translateX(-50%); }
.joy .down { bottom: 6px; left: 50%; transform: translateX(-50%); }
.joy .left { left: 9px; top: 50%; transform: translateY(-50%); }
.joy .right { right: 9px; top: 50%; transform: translateY(-50%); }
.joy .knob {
    position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; margin: -23% 0 0 -23%; border-radius: 50%;
    background: rgba(255, 255, 255, .95); box-shadow: 0 3px 8px rgba(0, 0, 0, .35); transition: transform .06s;
}
.tbtn {
    position: absolute; bottom: 16px; width: 84px; height: 84px; border-radius: 50%; font-size: 34px; line-height: 1;
    background: rgba(255, 255, 255, .5); border: 3px solid #fff; color: #3a2e5c; font-weight: 900;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .28); pointer-events: auto; touch-action: none; user-select: none; cursor: pointer;
}
.tbtn.on { background: rgba(255, 255, 255, .95); transform: scale(.94); }
.tbtn.l1 { left: 14px; } .tbtn.l2 { left: 108px; } .tbtn.r1 { right: 14px; } .tbtn.r2 { right: 108px; }
.tbtn.big { width: 100px; height: 100px; font-size: 40px; }

.topbar { flex-wrap: wrap; }

        .swrap { width: min(1100px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 12px; padding-bottom: 6px; }
        .swrap > .card { width: 100%; max-height: none; overflow: visible; animation: none; padding: clamp(12px, 2.2vw, 22px); }
        .qbar { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .qtitle { margin: 0; font-weight: 900; font-size: clamp(18px, 2.6vw, 26px); }
        #hint { min-height: 1.6em; padding: 6px 14px; border-radius: 14px; background: #fff6d9; font-weight: 800; font-size: clamp(14px, 1.9vw, 18px); line-height: 1.5; }
        #hint:empty { visibility: hidden; }

        .slots, .tray, .board { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .tray { margin-top: 18px; padding: 14px; min-height: 92px; border-radius: 20px; background: rgba(151, 117, 250, .1); align-content: center; }
        .slot {
            --w: 4; position: relative; min-width: calc(var(--w) * 1em + 56px); min-height: 76px; padding: 22px 16px 10px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            border-radius: 18px; border: 4px dashed #cfc6ea; background: #f8f5ff;
            font-weight: 900; font-size: clamp(18px, 2.6vw, 28px); transition: background .2s, border-color .2s;
        }
        .slot::before { content: attr(data-n); position: absolute; top: 3px; left: 12px; font-size: 14px; opacity: .55; }
        .slot.over { border-color: var(--grape); background: #efe7ff; }
        .slot.ok { border-style: solid; border-color: #2f9e44; background: #d3f9d8; }
        .slot.locked { border-color: var(--coral); background: #ffe3e3; pointer-events: none; }
        .slot.shake { animation: shake .35s; }
        .slot .cd { position: absolute; right: 12px; top: 3px; font-size: 14px; font-weight: 900; color: var(--coral); }

        .tile {
            --c: var(--dog);
            font: inherit; font-weight: 900; font-size: clamp(18px, 2.6vw, 28px); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
            padding: 12px 22px; border: 0; border-radius: 18px; background: var(--c);
            box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 68%, #000); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
            transition: transform .1s, opacity .2s;
        }
        .tile.c0 { --c: var(--coral); } .tile.c1 { --c: var(--mint); } .tile.c2 { --c: var(--dog); }
        .tile.c3 { --c: var(--grape); } .tile.c4 { --c: var(--cat); } .tile.c5 { --c: var(--pink); }
        .tile.sel { outline: 5px solid #ffd43b; transform: translateY(-4px); }
        .tile.dragging { opacity: .3; }
        .tile.over { outline: 5px solid var(--grape); }
        .ghost {
            position: fixed; z-index: 3000; pointer-events: none; transform: translate(-50%, -130%);
            padding: 10px 20px; border-radius: 18px; background: var(--grape); color: #fff; font-weight: 900; font-size: 22px;
            border: 3px solid #fff; box-shadow: 0 8px 18px rgba(58, 46, 92, .35);
        }
        .donebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin-top: 18px; padding: 12px 16px; border-radius: 18px; background: #d3f9d8; font-weight: 900; font-size: clamp(16px, 2.2vw, 22px); }
        .donebar[hidden] { display: none; }
        #game-over .card { width: min(460px, 100%); }
        #final-stats { white-space: pre-line; }
        #game-over .actions { margin: 0; }

        /* 玩法 2：排排站換位置 */
        .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .cell .pos { font-weight: 900; font-size: 14px; opacity: .6; }
        .cell .tile { min-width: calc(var(--w) * 1em + 40px); cursor: pointer; }
        .cell .tile.good { --c: #2f9e44; }
        .cell .tile.bad { --c: #868e96; }
        .cell .tile.pop { animation: tpop .3s; }
        @keyframes tpop { 40% { transform: scale(1.12); } }
        .toolrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }

        /* 玩法 3：河上踏石 */
        .scene { position: relative; display: grid; align-items: center; gap: 8px; padding: 46px 12px 18px; border-radius: 22px; overflow: hidden; background: linear-gradient(#bfe6ff, #5cb8ff); border: 4px solid #fff; box-shadow: 0 6px 0 rgba(58, 46, 92, .14); }
        .scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: repeating-linear-gradient(100deg, rgba(255, 255, 255, .22) 0 18px, transparent 18px 46px); pointer-events: none; }
        .bank { font-size: clamp(32px, 6vw, 56px); text-align: center; line-height: 1; }
        .stone {
            position: relative; z-index: 1; min-height: clamp(56px, 9vw, 84px); padding: 6px; border-radius: 50% / 42%;
            display: flex; align-items: center; justify-content: center; text-align: center; overflow-wrap: anywhere;
            background: #d9d4c8; border-bottom: 8px solid #a8a193; font-weight: 900; font-size: clamp(13px, 2.2vw, 22px); color: #5b5547;
        }
        .stone.done { background: #b2f2bb; border-bottom-color: #69a874; color: #1f6f2f; }
        .stone.next { outline: 4px dashed #fff; outline-offset: 3px; }
        .frog { position: absolute; z-index: 2; top: 4px; font-size: clamp(36px, 6vw, 58px); line-height: 1; transform: translateX(-50%); transition: left .4s cubic-bezier(.4, 0, .3, 1); pointer-events: none; }
        .frog.hop { animation: hop .4s; }
        .frog.splash { animation: shake .35s; }
        @keyframes hop { 50% { margin-top: -26px; } }
        .stepbar { height: 10px; margin: 12px 0 0; border-radius: 999px; background: rgba(58, 46, 92, .12); overflow: hidden; }
        .stepbar[hidden] { display: none; }
        #stepfill { height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffa94d, #ff6b6b); }
        #prompt { margin: 14px 0 10px; padding: 10px 14px; border-radius: 18px; background: linear-gradient(135deg, #f3ecff, #e6f4ff); text-align: center; font-size: clamp(18px, 2.8vw, 28px); font-weight: 900; }
        #choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        #choices .opt { min-height: clamp(54px, 8vw, 76px); font-size: clamp(16px, 2.4vw, 26px); overflow-wrap: anywhere; }
        @media (max-width: 640px) { .slot { min-width: 0; padding-left: 12px; padding-right: 12px; } }

    </style>
</head>
<body class="solo">
    <header class="topbar">
        <h1 class="logo"><span>🔢</span> 排序遊戲：排排站換位置 <span>🪜</span></h1>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><button id="fs-toggle" class="switch" type="button"><span>⛶ 全螢幕</span></button>
        <button id="zhuyin-toggle" class="switch" type="button" role="switch" aria-checked="false">
            <span class="track"><span class="thumb"></span></span>
            <span>注音字體</span>
        </button></div>
    </header>

    <section class="hud" aria-label="狀態">
        <div class="solo-chip"><span>⭐ 得分</span><b id="hud-score">0</b></div>
        <div class="solo-chip"><span>📚 題目</span><b id="hud-q">0/0</b></div>
        <div class="solo-chip"><span>⏱ 時間</span><b id="hud-time">0:00</b></div>
        <div class="solo-chip"><span>🔁 步數</span><b id="hud-moves">0</b></div>
    </section>

    <main class="swrap">
        <section class="card">
            <div class="qbar"><h2 class="qtitle" id="qtitle">排排站換位置</h2></div>
            <div id="hint"></div>
            <div class="board" id="board" style="margin-top:18px"></div>
            <div class="toolrow"><button class="btn sky" id="check-btn" type="button">✅ 檢查</button></div>
            <div class="donebar" id="donebar" hidden><span id="donetext"></span><button class="btn pink" id="next-btn" type="button">下一題 ▶</button></div>
        </section>
    </main>

    <footer>Made by <a href="https://kentxchang.blogspot.tw" target="_blank">阿剛老師</a></footer>

    <div id="game-over" class="overlay">
        <div class="card">
            <h2 id="winner-text"></h2>
            <p id="final-stats"></p>
            <div class="actions"><button class="btn" id="restart-game" type="button">重新開始</button></div>
        </div>
    </div>

    <div id="generator-screen" class="overlay">
        <div class="card">
            <h1>排序題庫設定</h1>
            <textarea id="generator-input" placeholder="每行一題，詞語依正確順序排好，用空格（或逗號、Tab）隔開">春 夏 秋 冬
小明 每天 騎 腳踏車 上學
I like to read books
早上 中午 下午 晚上
一 二 三 四 五 六</textarea>
            <div class="actions">
                <button class="btn" id="generator-submit" type="button">送出</button>
                <button class="btn pink" id="start-game" type="button" hidden>開始遊玩</button>
                <button class="btn sky" id="download-game" type="button">下載完整遊戲</button>
            </div>
            <div class="table-wrap">
                <table id="output-table">
                    <thead>
                        <tr><th>題號</th><th>正確順序</th><th>詞數</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="secret-trigger"></div>

    <script type="application/json" id="game-config">{}</script>
    <script>
/* ===== 排序題共用：注音字體／全螢幕、題庫、計時與分數、題庫面板、拖曳 ===== */
const $ = id => document.getElementById(id);
const CONFIG = (() => { try { return JSON.parse($('game-config').textContent) || {}; } catch (e) { return {}; } })();
const cfg = (key, fallback) => { const v = Number(CONFIG[key]); return CONFIG[key] != null && CONFIG[key] !== '' && Number.isFinite(v) ? v : fallback; };
const pick = list => list[Math.floor(Math.random() * list.length)];
const fmtTime = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function shuffle(list) {
    const a = [...list];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* 打亂順序，而且盡量和原本的順序不同 */
function shuffleDifferent(list) {
    let a = shuffle(list);
    for (let i = 0; i < 20 && a.every((x, k) => x === list[k]); i++) a = shuffle(list);
    return a;
}

/* ---------- 注音字體（預設關閉）與全螢幕 ---------- */
const zhuyinToggle = $('zhuyin-toggle');
function setZhuyin(on) {
    document.documentElement.classList.toggle('plain', !on);
    zhuyinToggle.setAttribute('aria-checked', String(on));
    try { localStorage.setItem('catdog-zhuyin', on ? '1' : '0'); } catch (e) {}
}
zhuyinToggle.addEventListener('click', () => setZhuyin(zhuyinToggle.getAttribute('aria-checked') !== 'true'));
let savedZhuyin = null;
try { savedZhuyin = localStorage.getItem('catdog-zhuyin'); } catch (e) {}
setZhuyin(savedZhuyin === '1');

$('fs-toggle').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
});

/* ---------- 題庫：一行一題，這一行詞語的順序就是正確順序 ----------
 * 有 Tab 時以 Tab 分隔；否則有逗號時以逗號分隔（詞語內可以有空格）；都沒有時以空白分隔。 */
function parseLine(line) {
    const parts = line.includes('\t') ? line.split('\t') : /[,，]/.test(line) ? line.split(/[,，]/) : line.split(/[\s　]+/);
    return parts.map(w => w.trim()).filter(Boolean);
}

const Bank = {
    all: [], order: [], i: 0,
    load(text) { this.all = text.split('\n').map(parseLine).filter(w => w.length >= 2); },
    /* 依設定決定這一局的題目與順序（rounds = 0 代表全部題目） */
    begin() {
        const list = cfg('shuffleQ', 0) === 1 ? shuffle(this.all) : [...this.all];
        const n = cfg('rounds', 0);
        this.order = n > 0 ? list.slice(0, n) : list;
        this.i = 0;
    },
    get total() { return this.order.length; },
    cur() { return this.order[this.i]; },
    get last() { return this.i >= this.order.length - 1; }
};

/* ---------- 一局遊戲：分數、題數、時間、結束畫面 ---------- */
const Run = {
    score: 0, solved: 0, mistakes: 0, t0: 0, tEnd: 0, over: false, timer: 0,
    start() {
        this.score = this.solved = this.mistakes = 0;
        this.over = false;
        this.t0 = performance.now();
        clearInterval(this.timer);
        this.timer = setInterval(() => this.hud(), 250);
        $('game-over').classList.remove('show');
        this.hud();
    },
    elapsed() { return (this.over ? this.tEnd : performance.now()) - this.t0; },
    hud() {
        $('hud-score').textContent = this.score;
        $('hud-q').textContent = Bank.total ? `${Math.min(Bank.i + 1, Bank.total)}/${Bank.total}` : '0/0';
        $('hud-time').textContent = fmtTime(this.elapsed());
    },
    end(title, extra = '') {
        if (this.over) return;
        this.over = true;
        this.tEnd = performance.now();
        clearInterval(this.timer);
        this.hud();
        $('winner-text').textContent = title;
        $('final-stats').textContent = `得分 ${this.score}　完成 ${this.solved} / ${Bank.total} 題\n用時 ${fmtTime(this.elapsed())}${extra ? '　' + extra : ''}`;
        $('game-over').classList.add('show');
    }
};

/* ---------- 拖曳（滑鼠與觸控共用）：拖到目標上放下；沒移動就當作「點一下」 ---------- */
function dragSource(el, { ghost, targetSel, hover, drop, tap }) {
    el.addEventListener('pointerdown', e => {
        if (e.button > 0) return;
        e.preventDefault();
        const st = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false, g: null };
        const targetAt = (x, y) => { const t = document.elementFromPoint(x, y); return t ? t.closest(targetSel) : null; };
        const move = ev => {
            if (ev.pointerId !== st.id) return;
            if (!st.moved && Math.hypot(ev.clientX - st.x, ev.clientY - st.y) > 8) {
                st.moved = true;
                st.g = document.createElement('div');
                st.g.className = 'ghost';
                st.g.textContent = ghost();
                document.body.appendChild(st.g);
                el.classList.add('dragging');
            }
            if (!st.moved) return;
            st.g.style.left = ev.clientX + 'px';
            st.g.style.top = ev.clientY + 'px';
            if (hover) hover(targetAt(ev.clientX, ev.clientY));
        };
        const up = ev => {
            if (ev.pointerId !== st.id) return;
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            window.removeEventListener('pointercancel', up);
            if (st.g) st.g.remove();
            el.classList.remove('dragging');
            if (hover) hover(null);
            if (ev.type === 'pointercancel') return;
            if (st.moved) { const t = targetAt(ev.clientX, ev.clientY); if (t) drop(t); }
            else if (tap) tap();
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
    });
}

/* ---------- 題庫面板（按 r 開啟） ---------- */
const generatorScreen = $('generator-screen');
const generatorInput = $('generator-input');
const startGameButton = $('start-game');
const outputTableBody = document.querySelector('#output-table tbody');

$('generator-submit').addEventListener('click', () => {
    Bank.load(generatorInput.value);
    outputTableBody.replaceChildren();
    Bank.all.forEach((words, i) => {
        const tr = document.createElement('tr');
        for (const text of [i + 1, words.join(' → '), words.length]) {
            const td = document.createElement('td');
            td.textContent = text;
            tr.appendChild(td);
        }
        outputTableBody.appendChild(tr);
    });
    startGameButton.hidden = false;
});

startGameButton.addEventListener('click', () => {
    generatorScreen.classList.remove('show');
    startGame();
});
$('restart-game').addEventListener('click', () => startGame());
$('secret-trigger').addEventListener('click', () => generatorScreen.classList.add('show'));

document.addEventListener('keydown', e => {
    if (e.target.matches('textarea, input')) return;
    if (e.key === 'r' || e.key === 'R') generatorScreen.classList.toggle('show');
});

$('download-game').addEventListener('click', () => {
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector('#generator-input').textContent = generatorInput.value;
    clone.querySelectorAll('.overlay.show').forEach(el => el.classList.remove('show'));
    const url = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], { type: 'text/html' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = document.title + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
});

/* 沒有足夠題目時的提示；回傳是否可以開始 */
function bankReady() {
    if (Bank.all.length) return true;
    $('hint').textContent = '請先輸入題庫（按 r 開啟題庫面板）：一行一題，詞語用空格隔開，順序就是正確順序';
    return false;
}

window.addEventListener('load', () => {
    if (generatorInput.value.trim() !== '') {
        $('generator-submit').click();
        startGameButton.click();
    }
});

/* 全場總分：對外公開的唯一路徑 window.score（有限數字，分數一變動就同步） */
Object.defineProperty(window, 'score', { get: () => Run.score, configurable: true });


/* ===== 排序玩法 2：排排站換位置（點兩張卡片交換，全部站對就過關） ===== */
const SHOW_HINT = cfg('hint', 1) === 1;
let q = null, sel = null, checking = false, moves = 0;

const solved = () => q.arr.every((wid, pos) => q.words[wid] === q.words[pos]);

function loadQ() {
    const words = Bank.cur();
    const ids = words.map((w, i) => i);
    q = { words, arr: shuffleDifferent(ids), moves: 0, checks: 0, finished: false };
    for (let i = 0; i < 20 && solved(); i++) q.arr = shuffle(ids);
    sel = null;
    checking = false;
    $('qtitle').textContent = `第 ${Bank.i + 1} 題：把詞語換到正確的位置`;
    $('hint').textContent = SHOW_HINT ? '點兩張卡片交換位置，或把卡片拖到另一張上。站對的卡片會變成綠色！' : '點兩張卡片交換位置，或把卡片拖到另一張上。想知道對不對，按「檢查」。';
    $('check-btn').hidden = SHOW_HINT;
    $('donebar').hidden = true;
    $('board').style.setProperty('--w', Math.max(...words.map(w => [...w].length)));
    render();
    Run.hud();
}

function render(popA = -1, popB = -1) {
    const board = $('board');
    board.replaceChildren();
    q.arr.forEach((wid, pos) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = `tile c${wid % 6}`;
        tile.textContent = q.words[wid];
        tile.dataset.pos = pos;
        const right = q.words[wid] === q.words[pos];
        if (SHOW_HINT || checking) tile.classList.add(right ? 'good' : (checking ? 'bad' : 'x'));
        if (sel === pos) tile.classList.add('sel');
        if (pos === popA || pos === popB) tile.classList.add('pop');
        dragSource(tile, {
            ghost: () => q.words[wid],
            targetSel: '.tile',
            hover: t => board.querySelectorAll('.tile').forEach(el => el.classList.toggle('over', el === t && el !== tile)),
            drop: t => swap(pos, Number(t.dataset.pos)),
            tap: () => tapCard(pos)
        });
        const label = document.createElement('span');
        label.className = 'pos';
        label.textContent = `第 ${pos + 1} 位`;
        cell.append(tile, label);
        board.appendChild(cell);
    });
}

function tapCard(pos) {
    if (q.finished || Run.over) return;
    if (sel === null) sel = pos;
    else if (sel === pos) sel = null;
    else { swap(sel, pos); return; }
    render();
}

function swap(a, b) {
    if (q.finished || Run.over || a === b) return;
    [q.arr[a], q.arr[b]] = [q.arr[b], q.arr[a]];
    q.moves++;
    moves++;
    sel = null;
    $('hud-moves').textContent = moves;
    render(a, b);
    if (solved()) completeQ();
}

$('check-btn').addEventListener('click', () => {
    if (q.finished || checking || Run.over) return;
    q.checks++;
    checking = true;
    render();
    setTimeout(() => { checking = false; if (!q.finished) render(); }, 1500);
});

function completeQ() {
    q.finished = true;
    const extra = Math.max(0, q.moves - (q.words.length - 1));
    const gain = Math.max(20, 100 - 5 * extra - 5 * q.checks);
    Run.score += gain;
    Run.solved++;
    Run.hud();
    $('hint').textContent = '';
    $('donetext').textContent = `✅ 排好了！用了 ${q.moves} 步${q.checks ? `、檢查 ${q.checks} 次` : ''}　+${gain} 分`;
    $('next-btn').textContent = Bank.last ? '🏁 看結果' : '下一題 ▶';
    $('donebar').hidden = false;
}

$('next-btn').addEventListener('click', () => {
    if (Bank.last) Run.end('🎉 全部完成！', `共 ${moves} 步`);
    else { Bank.i++; loadQ(); }
});

function startGame() {
    if (!bankReady()) return;
    Bank.begin();
    Run.start();
    moves = 0;
    $('hud-moves').textContent = 0;
    loadQ();
}

    </script>
</body>
